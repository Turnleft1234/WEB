name: Sync game comment

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: contains(github.event.issue.body, 'grind-share-comment')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append comment to data/comments.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import re
          import sys

          body = os.environ.get("ISSUE_BODY", "")

          def extract(field: str) -> str:
              match = re.search(rf"^{re.escape(field)}:\s*(.+)$", body, re.MULTILINE)
              return match.group(1).strip() if match else ""

          game_id = extract("game_id")
          text = extract("text")
          author = extract("author") or "访客"

          if not game_id or not text:
              print("Missing game_id or text", file=sys.stderr)
              sys.exit(1)

          if len(text) > 100:
              print("Comment exceeds 100 characters", file=sys.stderr)
              sys.exit(1)

          path = "data/comments.json"
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)

          comments = data.get(game_id, [])
          comments.insert(
              0,
              {
                  "id": f"comment-{int(datetime.datetime.now(datetime.timezone.utc).timestamp())}",
                  "text": text,
                  "author": author,
                  "createdAt": datetime.datetime.now(datetime.timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              },
          )
          data[game_id] = comments[:50]

          with open(path, "w", encoding="utf-8") as handle:
              json.dump(data, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comments.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add game comment from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "留言已写入 data/comments.json 并同步到站点，感谢分享。"
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
